groups:
- name: wordpress_stress
  rules:
  - alert: HighLoadAverage
    expr: node_load1 > 4
    for: 30s
    labels:
      severity: warning
    annotations:
      summary: "High load average {{ $value }}"

  - alert: MemoryPressure
    expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.1
    for: 30s
    labels:
      severity: critical
    annotations:
      summary: "Less than 10% RAM available"

  - alert: PHPFPMQueueFull
    expr: phpfpm_listen_queue > 5
    for: 10s
    labels:
      severity: warning
    annotations:
      summary: "PHP-FPM listen queue > 5 (workers saturated)"

  - alert: MySQLHighThreads
    expr: mysql_global_status_threads_running > 20
    for: 10s
    labels:
      severity: warning
    annotations:
      summary: "MySQL {{ $value }} threads running simultaneously"
