server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
- url: http://loki:3100/loki/api/v1/push

scrape_configs:
- job_name: docker
  docker_sd_configs:
  - host: unix:///var/run/docker.sock
    refresh_interval: 5s
  relabel_configs:
  - source_labels: [ '__meta_docker_container_name' ]
    regex: '/(.*)'
    target_label: container
  - source_labels: [ '__meta_docker_container_label_com_docker_compose_service' ]
    target_label: service
  pipeline_stages:
  - docker: {}

- job_name: nginx_access
  static_configs:
  - targets: [ localhost ]
    labels:
      job: nginx_access
      __path__: /var/lib/docker/containers/*/*-json.log
  pipeline_stages:
  - json:
      expressions:
        log: log
        stream: stream
  - labels:
      stream:
  - match:
      selector: '{job="nginx_access"}'
      stages:
      - regex:
          expression: '(?P<remote_addr>\S+) .* \[(?P<time_local>[^\]]+)\] "(?P<request>[^"]+)" (?P<status>\d+) (?P<bytes>\d+) "(?P<referer>[^"]*)" "(?P<ua>[^"]*)" rt=(?P<rt>\S+)'
      - labels:
          status:
          rt:
