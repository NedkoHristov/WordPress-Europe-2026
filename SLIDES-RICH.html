<h2 id="level-0--how-apache-prefork-works">Level 0 — How Apache prefork works</h2>
<p><strong>Each connection = one OS process</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Browser connects
  → Apache forks a worker process
    → worker loads PHP + WordPress into RAM
      → PHP runs, queries MySQL
        → response sent
          → worker stays alive, waiting
            (idle, ~32 MB RAM held)
</code></pre>
<p><strong>The problem:</strong></p>
<ul>
<li>60 idle workers = 1.9 GB RAM consumed</li>
<li>Browser #61 gets: queue</li>
<li>Browser #200 gets: <strong>503</strong></li>
</ul>
<blockquote>
<p>The process model was designed for static files in 1996.<br />
WordPress averages <strong>300+ database queries per page.</strong></p>
</blockquote>

<h1 id="act-ii">ACT II</h1>
<h2 id="stop-the-bleeding">Stop the Bleeding</h2>
<h3 id="level-1--nginx--php-fpm--opcache--redis">Level 1 — Nginx + PHP-FPM + OPcache + Redis</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" lang="C">
<h2 id="level-1--three-changes-zero-cost">Level 1 — Three changes, zero cost</h2>
<p><strong>1. Nginx (event-driven)</strong><br />
One thread, 10,000+ concurrent connections.<br />
Zero RAM per idle connection.</p>
<p><strong>2. PHP-FPM (decoupled pool)</strong><br />
Workers handle PHP execution only.<br />
Nginx queues connections externally.<br />
<code>pm.max_children = 20</code> — hard limit, <strong>never OOM</strong>.</p>
<p><strong>3. OPcache + Redis object cache</strong></p>
<ul>
<li>OPcache: compiled PHP bytecode in shared memory — zero disk reads</li>
<li>Redis: DB query results in RAM — 82% of DB calls served from memory</li>
</ul>
<br />
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">make level-1   <span class="hljs-comment"># 10 seconds to switch</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" lang="C">
<h2 id="opcache--the-biggest-free-win">OPcache — the biggest free win</h2>
<div class="cols">
<div class="card">
<h3 id="%E2%9D%8C-without-opcache-level-0"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> Without OPcache (Level 0)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Every single request:
  disk read  → parse → lex
  → AST → compile → opcodes
  → execute → response

Repeat for 300+ PHP files.
wp-settings.php alone
includes 100+ files.
</code></pre>
</div>
<div class="card">
<h3 id="%E2%9C%85-with-opcache-level-1"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> With OPcache (Level 1+)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>First request only:
  compile → store in shared RAM

Every request after:
  read opcodes from RAM
  → execute → response

Zero disk. Zero compilation.
~98% hit rate after 30s of traffic.
</code></pre>
</div>
</div>
<br />
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ini"><span class="hljs-attr">opcache.enable</span> = <span class="hljs-number">1</span>
<span class="hljs-attr">opcache.validate_timestamps</span> = <span class="hljs-number">0</span>   <span class="hljs-comment">; never re-check disk (production)</span>
<span class="hljs-attr">opcache.memory_consumption</span> = <span class="hljs-number">256</span>  <span class="hljs-comment">; MB</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-class="screenshot" lang="C" class="screenshot" style="--class:screenshot;">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" lang="C">
<h2 id="level-1--what-redis-is-actually-doing">Level 1 — what Redis is actually doing</h2>
<p><strong>46,000 cached keys · 14.5 MB · 6,000 ops/s at peak</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>WordPress makes 300+ DB calls per page request.
Redis intercepts most of them:

wp_get_option('siteurl')        → Redis HIT → 0.1 ms
wp_get_option('blogname')       → Redis HIT → 0.1 ms
WP_Query (recent posts)         → Redis HIT → 0.1 ms
get_post_meta(post_id, '_price')→ Redis HIT → 0.1 ms
WC product lookup               → Redis MISS → MySQL → 4 ms → cached

After warmup: ~82% of DB calls answered from memory.
MySQL sees ~54 queries/request instead of 300+.
</code></pre>
<blockquote>
<p>Redis did not prevent the crash at Level 0 because we never got there.<br />
It <strong>would</strong> delay the crash significantly — but doesn't eliminate it.<br />
That requires removing PHP from the hot path entirely.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-class="act" lang="C" class="act" style="--class:act;"><div class="act-icon">🚀</div>
<h1 id="act-iii">ACT III</h1>
<h2 id="cache-everything">Cache Everything</h2>
<h3 id="level-2--fastcgi-page-cache--mariadb-tuning">Level 2 — FastCGI page cache + MariaDB tuning</h3>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" lang="C">
<h2 id="the-key-insight">The key insight</h2>
<blockquote>
<p><strong>Most WordPress page requests return identical HTML for every anonymous visitor.</strong><br />
Home page. Category. Blog post. Shop.<br />
PHP runs. MySQL queries. OPcache helps. Redis helps.<br />
<strong>The output is still the same HTML every time.</strong></p>
</blockquote>
<p><strong>FastCGI page cache — the logical conclusion:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>First anonymous visitor  → PHP runs → nginx stores response on disk
Every visitor after      → nginx reads cached file → 8ms TTFB
                           PHP never runs
                           MySQL never runs
                           Redis never asked
</code></pre>
<div class="cols">
<div class="card">
<p><strong>Cached (anonymous visitors)</strong> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/><br />
Homepage · Category pages · Posts · Shop</p>
</div>
<div class="card">
<p><strong>Bypassed (dynamic)</strong> <img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f504.svg" data-marp-twemoji=""/><br />
Logged-in · Cart · Checkout · Admin</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" lang="C">
<h2 id="level-2--nginx-config">Level 2 — nginx config</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-nginx"><span class="hljs-attribute">fastcgi_cache_path</span> /var/cache/nginx
  levels=<span class="hljs-number">1</span>:<span class="hljs-number">2</span>
  keys_zone=WORDPRESS:<span class="hljs-number">100m</span>
  inactive=<span class="hljs-number">60m</span>
  max_size=<span class="hljs-number">1g</span>;

<span class="hljs-comment"># Bypass rule — logged-in users and WooCommerce sessions</span>
<span class="hljs-attribute">set</span> <span class="hljs-variable">$skip_cache</span> <span class="hljs-number">0</span>;
<span class="hljs-attribute">if</span> (<span class="hljs-variable">$http_cookie</span> <span class="hljs-regexp">~* &quot;wordpress_logged_in|woocommerce_cart|woocommerce_session&quot;)</span> {
    <span class="hljs-attribute">set</span> <span class="hljs-variable">$skip_cache</span> <span class="hljs-number">1</span>;
}

<span class="hljs-section">location</span> <span class="hljs-regexp">~ \.php$</span> {
    <span class="hljs-attribute">fastcgi_cache</span> WORDPRESS;
    <span class="hljs-attribute">fastcgi_cache_key</span> <span class="hljs-string">&quot;<span class="hljs-variable">$scheme</span><span class="hljs-variable">$request_method</span><span class="hljs-variable">$host</span><span class="hljs-variable">$request_uri</span>&quot;</span>;
    <span class="hljs-attribute">fastcgi_cache_valid</span> <span class="hljs-number">200</span> <span class="hljs-number">60m</span>;
    <span class="hljs-attribute">fastcgi_cache_bypass</span> <span class="hljs-variable">$skip_cache</span>;
    <span class="hljs-attribute">fastcgi_no_cache</span> <span class="hljs-variable">$skip_cache</span>;
    <span class="hljs-attribute">add_header</span> X-Cache-Status <span class="hljs-variable">$upstream_cache_status</span>;  <span class="hljs-comment"># HIT / MISS / BYPASS</span>
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">make level-2   <span class="hljs-comment"># 10 seconds to switch. Same hardware.</span>
</code></pre>

<p><strong>In 5 minutes of the test:</strong> <code>9,940 total requests</code></p>
<ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" lang="C">
<h2 id="mariadb-tuning--level-2">MariaDB tuning — Level 2</h2>
<div class="cols">
<div>
<p><strong>Level 0 baseline config:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ini"><span class="hljs-comment"># 00-baseline.cnf</span>
<span class="hljs-attr">innodb_buffer_pool_size</span> = <span class="hljs-number">128</span>M
<span class="hljs-comment"># (default — fits almost nothing)</span>
<span class="hljs-attr">max_connections</span> = <span class="hljs-number">151</span>
</code></pre>
<p>With 128M buffer pool:</p>
<ul>
<li>WordPress DB ≈ 500MB</li>
<li><strong>Every query reads from disk</strong></li>
<li>Buffer pool full → constant disk I/O</li>
<li>Slow queries undetected</li>
</ul>
</div>
<div>
<p><strong>Level 2 tuned config:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-ini"><span class="hljs-comment"># 10-tuned.cnf</span>
<span class="hljs-attr">innodb_buffer_pool_size</span> = <span class="hljs-number">512</span>M
<span class="hljs-attr">innodb_flush_log_at_trx_commit</span> = <span class="hljs-number">2</span>
<span class="hljs-attr">innodb_log_file_size</span> = <span class="hljs-number">128</span>M
<span class="hljs-attr">slow_query_log</span> = <span class="hljs-number">1</span>
<span class="hljs-attr">long_query_time</span> = <span class="hljs-number">0.5</span>
</code></pre>
<p>After tuning:</p>
<ul>
<li>DB fits in RAM → sub-millisecond reads</li>
<li>Commits batched (1×/sec vs every write)</li>
<li>Slow queries logged → visible in Loki</li>
<li><strong>MariaDB Threads Running: 12.5 → 3</strong></li>
</ul>
</div>
</div>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" lang="C">
<h2 id="the-static-export-concept">The static export concept</h2>
<p><strong>Build time</strong> (once, on each publish):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">make static-build
<span class="hljs-comment"># wget crawls all published pages</span>
<span class="hljs-comment"># saves complete HTML to static/export/</span>
<span class="hljs-comment"># runs in ~30s for 2,500 posts</span>
</code></pre>
<p><strong>Runtime</strong> (every anonymous request):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Browser → Nginx
  ├── /home         → static HTML file (0ms PHP)
  ├── /post-2498/   → static HTML file (0ms PHP)
  └── /checkout     → proxy → WordPress (live)
     /wp-admin      → proxy → WordPress (live)
     /wp-json/cart  → proxy → WordPress (live)
</code></pre>
<p><strong>WordPress only activates for cart / checkout / admin.</strong><br />
The rest is a static file server.</p>
</section>

<h2 id="the-full-cache-hierarchy">The full cache hierarchy</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Request from browser
  │
  ▼
[Cloudflare CDN]  ← Level 3 (edge cache, global PoP)
  │ miss
  ▼
[Nginx FastCGI Cache]  ← Level 2 (disk cache, 60-min TTL)
  │ miss
  ▼
[PHP-FPM]  ← always running, pool of 20 workers
  ├── [OPcache]  ← Level 1 (compiled bytecode in RAM)
  └── [Redis Object Cache]  ← Level 1 (DB query results in RAM)
       │ miss (first time only)
       ▼
    [MariaDB]  ← tuned at Level 2: 512MB buffer pool
</code></pre>
<blockquote>
<p>Each layer absorbed ~70–95% of what reached it.<br />
MariaDB only sees the requests Redis couldn't answer.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" lang="C">
<h2 id="lessons-learned">Lessons learned</h2>
<div class="cols">
<div>
<p><strong>1. Measure before you fix</strong></p>
<div class="card">
<p>Set up Prometheus + Grafana<br />
<strong>before</strong> you need it.<br />
You cannot fix what you cannot see.</p>
<p><code>make obs-up</code> — 30 seconds.</p>
</div>
<br />
<p><strong>2. The three WP cache layers</strong></p>
<div class="card">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>OPcache  → PHP bytecode  → always on
Redis    → DB queries    → wp redis enable
FastCGI  → Full pages    → nginx.conf
</code></pre>
<p>Most sites use 0 of these 3.<br />
All three: completely different machine.</p>
</div>
</div>
<div>
