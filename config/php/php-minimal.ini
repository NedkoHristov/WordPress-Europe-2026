; PHP — Minimal configuration for $12 VPS
; Conservative settings optimized for 1GB environment

memory_limit = 96M
max_execution_time = 30
post_max_size = 32M
upload_max_filesize = 32M

expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; OPcache CRITICAL on VPS (huge performance boost)
; Even minimal settings provide 5-10x improvement
opcache.enable = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.save_comments = 0

; PHP-FPM pool settings
; Note: Actual pool config is in www-minimal.conf

; Disable functions that waste resources on VPS
disable_functions = proc_open,proc_close,system,shell_exec,exec,passthru,escapeshellarg,escapeshellcmd
