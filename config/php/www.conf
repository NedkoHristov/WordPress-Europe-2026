; PHP-FPM pool config — Level 1+
; CRITICAL FORMULA: pm.max_children = available_RAM / avg_worker_RAM
; On a 2GB VPS with 512MB reserved for OS+MySQL+Redis:
;   available ≈ 768MB, avg WP worker ≈ 40MB → max_children ≈ 19
[www]
user = www-data
group = www-data
; Listen on TCP for Nginx + exporter
listen = 0.0.0.0:9000
; Note: For security in production, restrict to specific container IPs
; In development/demo, we accept all connections from the Docker network

; Process manager — dynamic scales workers based on demand
pm = dynamic
pm.max_children = 20
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12

; Status page — required by php-fpm-exporter
pm.status_path = /status
ping.path = /ping

; Slow log — shown in Grafana/Loki (Level 2+)
slowlog = /proc/1/fd/2
request_slowlog_timeout = 2s

; Pass env to PHP
clear_env = no
