; Level 0 — intentionally weak PHP settings (Apache baseline)
; DO NOT use in production — demonstration purposes only
memory_limit = 128M
max_execution_time = 30
post_max_size = 32M
upload_max_filesize = 32M
expose_php = On
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; OPcache OFF — this is what causes the baseline to be so slow
opcache.enable = 0
