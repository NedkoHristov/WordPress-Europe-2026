; PHP-FPM pool config — Optimized for $12 DigitalOcean Droplet (2GB RAM)
; CRITICAL FORMULA: pm.max_children = available_RAM / avg_worker_memory
; On a 2GB VPS with 480MB budget for PHP:
;   average WP worker ≈ 40MB → max_children ≈ 12

[www]
user = www-data
group = www-data

; Listen on TCP for Nginx + exporter
listen = 0.0.0.0:9000
listen.backlog = 1024

; Process manager — dynamic scales workers based on demand
; Optimized for 2GB environment:
pm = dynamic
pm.max_children = 12
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10

; Allow requests from Docker network (all containers)
pm.max_requests = 10000
pm.max_requests_grace_period = 30s

; Status page — required by php-fpm-exporter
pm.status_path = /status
ping.path = /ping

; Reduce slowlog to decrease I/O
slowlog = /proc/1/fd/2
request_slowlog_timeout = 5s

; Pass environment variables to PHP
clear_env = no

; Resource limits for minimal environment
rlimit_files = 65535
rlimit_core = 0
