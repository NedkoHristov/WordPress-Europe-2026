worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'cache=$upstream_cache_status';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # ── FastCGI Page Cache ────────────────────────────────────────────────────
    # Key: cache lives in a volume (fastcgi_cache), survives FPM restarts
    fastcgi_cache_path /var/cache/nginx levels=1:2
                       keys_zone=WORDPRESS:100m
                       inactive=60m
                       max_size=1g;
    fastcgi_cache_key "$scheme$request_method$host$request_uri";

    # Microcache for logged-in users (optional — see comment below)
    # fastcgi_cache_path /var/cache/nginx-auth ...

    server {
        listen 80;
        server_name _;

        root /var/www/html;
        index index.php;

        # Cache bypass rules — never cache admin, logged-in, cart, checkout
        set $skip_cache 0;
        if ($request_method = POST)           { set $skip_cache 1; }
        if ($query_string != "")              { set $skip_cache 1; }
        if ($request_uri ~* "wp-admin|wp-login|xmlrpc|feed|sitemap") { set $skip_cache 1; }
        if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in") {
            set $skip_cache 1;
        }
        # WooCommerce
        if ($request_uri ~* "/cart|/checkout|/my-account|add-to-cart") { set $skip_cache 1; }
        if ($http_cookie ~* "woocommerce_items_in_cart|woocommerce_cart_hash") { set $skip_cache 1; }

        location /nginx_status {
            stub_status;
            allow all;
        }

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass wordpress-fpm:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;

            # Cache settings
            fastcgi_cache WORDPRESS;
            fastcgi_cache_valid 200 301 302 60m;
            fastcgi_cache_use_stale error timeout invalid_header http_500 http_503 updating;
            fastcgi_cache_lock on;
            fastcgi_no_cache $skip_cache;
            fastcgi_cache_bypass $skip_cache;

            add_header X-Cache-Status $upstream_cache_status;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            log_not_found off;
        }

        location ~* /(?:uploads|files)/.*\.php$ {
            deny all;
        }
    }
}
