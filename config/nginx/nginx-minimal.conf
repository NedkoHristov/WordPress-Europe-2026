# Nginx — Minimal configuration for $12 VPS
# Optimized for low-memory deployment with FastCGI caching

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
    multi_accept off;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main buffer=32k flush=10s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    types_hash_max_size 2048;
    client_max_body_size 32M;

    # Gzip compression (reduce bandwidth on VPS)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml application/atom+xml image/svg+xml;
    gzip_min_length 1024;
    gzip_disable "msie6";

    # Include FastCGI cache configuration
    include /etc/nginx/fastcgi-cache.conf;

    # Main WordPress server
    server {
        listen 80 default_server;
        server_name _;

        root /var/www/html;
        index index.php;

        # Metrics endpoint for nginx-exporter
        location /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }

        # WordPress routing
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        # PHP handler with FastCGI caching
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass wordpress-fpm:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 30;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 256 16k;

            # FastCGI cache
            fastcgi_cache WORDPRESS;
            fastcgi_cache_valid 200 10m;
            fastcgi_cache_use_stale error timeout updating http_500 http_503;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Static files — no caching by nginx (let browser cache)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Deny access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ wp-config\.php {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
